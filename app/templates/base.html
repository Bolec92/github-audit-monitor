<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}GitHub Audit Monitor{% endblock %}</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--good:#3fb950;--warn:#d29922;--bad:#f85149}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.top{display:flex;gap:20px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);background:#010409;position:sticky;top:0;z-index:2}.brand{font-weight:700;font-size:16px;white-space:nowrap}.top nav{display:flex;gap:14px;flex-wrap:wrap}.wrap{max-width:1500px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.kpi b{font-size:27px;display:block}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-size:12px}.clickrow:hover{background:#1c222b}.btn{display:inline-block;border:1px solid var(--line);background:#21262d;color:var(--text);padding:8px 12px;border-radius:7px;cursor:pointer}.btn:hover{background:#30363d;text-decoration:none}.btn.primary{background:#1f6feb}.btn.badbtn{color:#ff7b72}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.section{margin-top:24px}.pill{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:99px;margin:2px;font-size:12px}.perm-admin{color:#ff7b72}.perm-maintain{color:#d2a8ff}.perm-write{color:#79c0ff}.perm-triage{color:#ffa657}.perm-read{color:#7ee787}.state-current{color:#7ee787;border-color:#238636}.state-outside{color:#79c0ff;border-color:#1f6feb}.state-repo-collab{color:#d2a8ff;border-color:#8957e5}.state-removed{color:#ff7b72;border-color:#da3633}.state-pending{color:#d29922;border-color:#9e6a03}.state-hidden{color:#8b949e;border-color:#6e7681}.status{padding:8px 10px;border-radius:7px;background:#0d1117;border:1px solid var(--line)}input,textarea{background:#0d1117;color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:7px;width:100%}input[type=file]{padding:7px}.search{max-width:500px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field textarea{min-height:110px}code{color:#a5d6ff}.small{font-size:12px}.right{margin-left:auto}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.access-source{margin:5px 0;padding:7px 9px;background:var(--panel2);border-radius:6px}.timeline{border-left:2px solid var(--line);margin-left:7px;padding-left:18px}.event{margin:0 0 13px}.event .when{font-size:12px;color:var(--muted)}.subtle{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}}
.change-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.change-compare pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:8px;max-height:300px;overflow:auto}.stats-top{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.donut-card{display:flex;gap:24px;align-items:center}.donut{--added:50%;width:150px;height:150px;flex:0 0 150px;border-radius:50%;background:conic-gradient(var(--good) 0 var(--added),var(--bad) var(--added) 100%);display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;inset:24px;background:var(--panel);border-radius:50%}.donut>div{position:relative;z-index:1;text-align:center}.donut b{display:block;font-size:27px}.donut span{font-size:12px;color:var(--muted)}.legend{display:flex;gap:16px;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.goodbg{background:var(--good)}.badbg{background:var(--bad)}.mini-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini-kpis>div{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:8px}.mini-kpis b{display:block;font-size:24px;margin-top:3px}.bars{display:grid;gap:12px}.barrow{display:grid;gap:5px}.barlabel{display:flex;justify-content:space-between;gap:10px}.bartrack{height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden}.barfill{display:block;height:100%;border-radius:999px}.goodfill{background:var(--good)}.badfill{background:var(--bad)}details summary{cursor:pointer;color:var(--accent)}@media(max-width:900px){.stats-top,.change-compare{grid-template-columns:1fr}.donut-card{align-items:flex-start;flex-direction:column}}</style>{% block head %}{% endblock %}</head><body>
<header class="top"><div class="brand">GitHub Audit Monitor · {{ org }}</div><nav><a href="/">Dashboard</a><a href="/users">Użytkownicy</a><a href="/audit">Import Audit Log</a><a href="/statistics">Statystyki</a><a href="/history">Historia zmian</a><a href="/changes">Zmiany snapshotów</a><a href="/snapshots">Snapshoty</a></nav></header><main class="wrap">{% block content %}{% endblock %}</main></body></html>
